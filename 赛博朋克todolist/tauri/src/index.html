<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>赛博朋克 · Todo list</title>
<!--
  赛博朋克 · Todo list —— 单文件客户端
  双击用浏览器打开即可使用；数据保存在本机 localStorage，不联网、不依赖 DSH。
  换机/备份：面板底部「导出 / 导入」按钮，导出 JSON 文件、导入时二次确认后覆盖任务与等级。
  想打包成 .exe：见 tauri/README.md（Tauri 2 包壳已备好，装好 Rust 即可 cargo build）。
-->
<style>
  :root {
    --nt-green: #00ff88;
    --nt-yellow: #ffff00;
    --nt-gray: #757575;
    --nt-ink: #eef7f1;
    --nt-dim: #a9b8af;
    --nt-faint: #8b9d93;
    --nt-shadow: rgba(6, 16, 11, .55);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif;
    background:
      radial-gradient(120% 80% at 70% 8%, rgba(0, 255, 136, .10), transparent 52%),
      radial-gradient(90% 70% at 15% 95%, rgba(255, 255, 0, .05), transparent 55%),
      repeating-linear-gradient(0deg, rgba(117, 117, 117, .05) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(117, 117, 117, .04) 0 1px, transparent 1px 40px),
      #10160f;
    color: var(--nt-ink);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    background: radial-gradient(120% 90% at 50% 0%, transparent 55%, rgba(6, 16, 11, .6));
    pointer-events: none;
  }

  /* ---------- widget ---------- */
  .nt-anchor { position: fixed; z-index: 10; }
  .nt-root { font-size: 13.5px; }

  /* collapsed ball = HUD token: xp ring + dark glass core */
  .nt-node {
    position: relative; width: 56px; height: 56px; border-radius: 50%;
    padding: 2.5px; display: flex; cursor: grab;
    user-select: none; -webkit-user-select: none; touch-action: none;
    box-shadow: 0 8px 20px var(--nt-shadow), 0 0 0 1px rgba(117, 117, 117, .35), 0 0 16px rgba(0, 255, 136, .2);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .nt-node:hover { transform: translateY(-1px) scale(1.03); box-shadow: 0 10px 24px var(--nt-shadow), 0 0 0 1px rgba(117, 117, 117, .45), 0 0 22px rgba(0, 255, 136, .4); }
  .nt-node:active { cursor: grabbing; }
  .nt-node.alarm { animation: nt-alarm 1.6s ease-in-out infinite; }
  .nt-node-core {
    flex: 1; border-radius: 50%; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    line-height: 1; overflow: hidden;
    background:
      radial-gradient(circle at 50% 30%, rgba(255, 255, 255, .10), rgba(255, 255, 255, 0) 58%),
      linear-gradient(165deg, rgba(0, 255, 136, .14) 0%, rgba(14, 22, 17, .92) 55%, rgba(8, 19, 13, .96) 100%);
    border: 1px solid rgba(117, 117, 117, .55);
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, .35), inset 0 -5px 10px rgba(4, 20, 12, .6);
  }
  .nt-node-core::after {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(117, 117, 117, .07) 0 1px, transparent 1px 3px);
    pointer-events: none;
  }
  .nt-node-count { position: relative; z-index: 1; font-size: 16px; font-weight: 800; color: var(--nt-green); text-shadow: 0 0 10px rgba(0, 255, 136, .6), 0 1px 0 rgba(4, 20, 12, .7); }
  .nt-node-count.overdue { color: var(--nt-yellow); text-shadow: 0 0 10px rgba(255, 255, 0, .65), 0 1px 0 rgba(4, 20, 12, .7); }
  .nt-node-bang { position: relative; z-index: 1; font-size: 9px; line-height: 1; font-weight: 800; color: var(--nt-yellow); margin-top: 2px; text-shadow: 0 0 7px rgba(255, 255, 0, .7); }

  /* expanded folder */
  .nt-panel { width: 340px; max-width: calc(100vw - 24px); position: relative; animation: nt-boot .24s cubic-bezier(.2, .9, .3, 1); }
  .nt-back { position: absolute; inset: 0; border-radius: 16px; border: 1px solid rgba(117, 117, 117, .55); background: linear-gradient(160deg, rgba(0, 255, 136, .09), rgba(26, 34, 27, .9) 60%), rgba(26, 34, 27, .82); pointer-events: none; box-shadow: 0 10px 24px var(--nt-shadow), inset 0 1px 0 rgba(255, 255, 255, .12); }
  .nt-back-1 { transform: rotate(-1.8deg) translate(-5px, -4px); opacity: .9; }
  .nt-back-2 { transform: rotate(1.4deg) translate(5px, 3px); opacity: .55; }
  .nt-tab {
    position: absolute; top: -11px; left: 16px; height: 22px; border-radius: 7px 7px 0 0;
    background: linear-gradient(180deg, #7dffc2 0%, #4dffb0 40%, #00ff88 70%, #08a463 100%);
    display: flex; align-items: center; gap: 7px; padding: 0 12px; z-index: 6; pointer-events: none;
    box-shadow: 0 -3px 10px rgba(0, 255, 136, .4), inset 0 1px 0 rgba(255, 255, 255, .55), inset 0 -1px 0 rgba(6, 16, 11, .3);
  }
  .nt-tab::after { content: ""; position: absolute; left: 1px; right: 1px; bottom: -1px; height: 1.5px; background: linear-gradient(90deg, var(--nt-gray), var(--nt-green), var(--nt-gray)); opacity: .85; }
  .nt-tab-lv { font-size: 10px; font-weight: 800; letter-spacing: .1em; color: #08130d; }
  .nt-tab-dot { width: 5px; height: 5px; border-radius: 50%; flex: none; }
  .nt-tab-dot-y { background: var(--nt-yellow); box-shadow: 0 0 5px rgba(255, 255, 0, .9); }
  .nt-tab-dot-r { background: var(--nt-gray); }
  .nt-metal {
    position: relative; padding: 1.5px; border-radius: 16px;
    background: linear-gradient(150deg, var(--nt-green) 0%, rgba(0, 255, 136, .45) 20%, var(--nt-gray) 42%, rgba(255, 255, 255, .78) 50%, var(--nt-gray) 58%, rgba(255, 255, 0, .6) 78%, var(--nt-green) 100%);
    box-shadow: 0 16px 38px var(--nt-shadow), 0 3px 8px rgba(6, 16, 11, .4), 0 0 22px rgba(0, 255, 136, .16);
  }
  .nt-glass {
    position: relative; border-radius: 14.5px;
    background:
      linear-gradient(155deg, rgba(0, 255, 136, .16) 0%, rgba(255, 255, 255, .08) 26%, rgba(255, 255, 0, .05) 54%, rgba(0, 255, 136, .12) 100%),
      rgba(26, 34, 27, .7);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .34), inset 0 -1px 0 rgba(6, 16, 11, .5), inset 1px 0 0 rgba(255, 255, 255, .14), inset -1px 0 0 rgba(6, 16, 11, .3);
    overflow: hidden;
  }
  .nt-glass::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background: linear-gradient(112deg, transparent 43%, rgba(255, 255, 255, .12) 48%, transparent 53%),
      radial-gradient(130% 70% at 10% 0%, rgba(255, 255, 255, .14), transparent 42%);
  }
  .nt-glass::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background: repeating-linear-gradient(0deg, rgba(117, 117, 117, .06) 0 1px, transparent 1px 3px);
  }
  .nt-head {
    position: relative; z-index: 2; display: flex; align-items: center; gap: 8px;
    padding: 12px 14px 9px; cursor: grab; user-select: none; -webkit-user-select: none;
    touch-action: none;
    background: linear-gradient(180deg, rgba(255, 255, 255, .06), transparent 70%);
    border-bottom: 1px solid rgba(117, 117, 117, .3);
  }
  .nt-head:active { cursor: grabbing; }
  .nt-headtext { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .nt-title {
    font-size: 21px; font-weight: 800; letter-spacing: 0; line-height: 1.1;
    background: linear-gradient(180deg, #ffffff 0%, #e6fff6 26%, #7dffc2 52%, #00ff88 74%, #b3ffdb 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: .6px rgba(0, 90, 48, .85);
    filter: drop-shadow(0 1px 0 rgba(255, 255, 255, .34)) drop-shadow(0 2px 1px rgba(6, 16, 11, .45)) drop-shadow(0 0 14px rgba(0, 255, 136, .4));
  }
  .nt-sub { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; line-height: 1.25; min-width: 0; }
  .nt-sub-en { font-size: 12px; font-weight: 700; letter-spacing: .01em; color: var(--nt-yellow); text-shadow: 0 0 9px rgba(255, 255, 0, .5), 0 1px 0 rgba(6, 16, 11, .5); }
  .nt-sub-sep { font-size: 11px; color: #9a9a9a; }
  .nt-sub-track { font-size: 8px; font-weight: 700; letter-spacing: .22em; color: #9a9a9a; text-shadow: 0 1px 0 rgba(255, 255, 255, .22); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .nt-cursor { width: 7px; height: 13px; background: var(--nt-yellow); animation: nt-blink 1.1s steps(2, start) infinite; box-shadow: 0 0 8px rgba(255, 255, 0, .8); flex: none; }
  .nt-spacer { flex: 1; }
  .nt-combo {
    padding: 2px 7px; border: 1px solid rgba(255, 255, 0, .65); border-radius: 7px;
    font-size: 10px; font-weight: 800; letter-spacing: .06em; color: var(--nt-yellow);
    background: rgba(255, 255, 0, .1); text-shadow: 0 0 7px rgba(255, 255, 0, .6);
    animation: nt-pop .22s cubic-bezier(.2, 1.4, .4, 1);
  }
  .nt-iconbtn {
    width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    background: transparent; border: none; border-radius: 6px; color: var(--nt-dim);
    font-size: 12px; line-height: 1; cursor: pointer; padding: 0;
  }
  .nt-iconbtn:hover { color: var(--nt-green); background: rgba(0, 255, 136, .12); }
  .nt-iconbtn-del:hover { color: var(--nt-yellow); background: rgba(255, 255, 0, .12); }
  .nt-headbtn { font-size: 13px; }
  .nt-xpline { position: relative; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 6px 14px 0; }
  .nt-xpbar { flex: 1; height: 4px; border-radius: 2px; background: rgba(117, 117, 117, .22); box-shadow: inset 0 1px 2px rgba(6, 16, 11, .45); overflow: hidden; }
  .nt-xpfill { height: 100%; border-radius: 2px; background: linear-gradient(180deg, #7dffc2, #00ff88); box-shadow: 0 0 8px rgba(0, 255, 136, .6), inset 0 1px 0 rgba(255, 255, 255, .45); transition: width .35s ease; }
  .nt-xpnum { font-size: 9px; font-weight: 700; color: var(--nt-faint); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .nt-statusline {
    position: relative; z-index: 2; display: flex; align-items: center; gap: 10px;
    padding: 5px 14px 6px; font-size: 10px; letter-spacing: .1em; color: var(--nt-dim);
    border-bottom: 1px solid rgba(117, 117, 117, .2); white-space: nowrap; overflow: hidden;
  }
  .nt-sync-ok { color: var(--nt-green); }
  .nt-clock { color: var(--nt-faint); font-variant-numeric: tabular-nums; }
  .nt-entry {
    position: relative; z-index: 2; display: flex; align-items: center; gap: 8px;
    margin: 11px 14px 0; padding: 8px 11px; border: 1px solid rgba(117, 117, 117, .45);
    border-radius: 9px; background: rgba(255, 255, 255, .05);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1);
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .nt-entry:focus-within { border-color: rgba(0, 255, 136, .75); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1), 0 0 0 1px rgba(0, 255, 136, .25), 0 0 14px rgba(0, 255, 136, .18); }
  .nt-entry.err { border-color: var(--nt-yellow); animation: nt-shake .3s ease; }
  .nt-prompt { color: var(--nt-green); font-weight: 800; text-shadow: 0 0 6px rgba(0, 255, 136, .6); }
  .nt-input { flex: 1; background: transparent; border: none; outline: none; color: var(--nt-ink); font: inherit; padding: 0; }
  .nt-input::placeholder { color: var(--nt-faint); }
  .nt-ddlpick { position: relative; z-index: 2; display: flex; gap: 5px; padding: 8px 14px 0; }
  .nt-ddlchip {
    flex: 1; padding: 3px 0; background: rgba(255, 255, 255, .04);
    border: 1px solid rgba(117, 117, 117, .35); border-radius: 7px;
    color: var(--nt-dim); font: inherit; font-size: 9.5px; letter-spacing: .03em; cursor: pointer;
    transition: color .12s ease, border-color .12s ease, background .12s ease;
  }
  .nt-ddlchip:hover { color: var(--nt-green); border-color: rgba(0, 255, 136, .5); }
  .nt-ddlchip[aria-pressed="true"] { background: rgba(0, 255, 136, .18); border-color: var(--nt-green); color: var(--nt-ink); box-shadow: 0 0 9px rgba(0, 255, 136, .3); }
  .nt-filters { position: relative; z-index: 2; display: flex; gap: 6px; padding: 9px 14px 0; }
  .nt-filter {
    flex: 1; padding: 4px 0; background: rgba(255, 255, 255, .04);
    border: 1px solid rgba(117, 117, 117, .4); border-radius: 8px; color: var(--nt-dim);
    font: inherit; font-size: 10.5px; letter-spacing: .12em; cursor: pointer;
    transition: color .12s ease, background .12s ease, box-shadow .12s ease;
  }
  .nt-filter:hover { color: var(--nt-green); border-color: rgba(0, 255, 136, .5); }
  .nt-filter[aria-pressed="true"] { background: linear-gradient(180deg, #4dffb0, #00ff88); border-color: var(--nt-green); color: #08130d; font-weight: 800; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 0 12px rgba(0, 255, 136, .5); }
  .nt-list {
    position: relative; z-index: 2; list-style: none; margin: 8px 14px 0; padding: 0 0 4px;
    max-height: min(300px, max(140px, calc(100vh - 390px))); min-height: 64px;
    overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(0, 255, 136, .4) transparent;
  }
  .nt-list::-webkit-scrollbar { width: 5px; }
  .nt-list::-webkit-scrollbar-thumb { background: rgba(0, 255, 136, .35); border-radius: 3px; }
  .nt-row { position: relative; display: flex; align-items: center; gap: 8px; padding: 6px 2px; border-bottom: 1px dashed rgba(117, 117, 117, .25); animation: nt-glitchin .2s cubic-bezier(.2, .9, .3, 1); }
  .nt-row:last-child { border-bottom: none; }
  .nt-row.done .nt-text { color: var(--nt-faint); text-decoration: line-through; text-decoration-color: var(--nt-yellow); text-decoration-thickness: 1.5px; }
  .nt-row.pop { animation: nt-pop .28s cubic-bezier(.2, 1.5, .4, 1); }
  .nt-check {
    width: 17px; height: 17px; flex: none; display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, .06); border: 1.5px solid rgba(117, 117, 117, .75);
    border-radius: 50%; cursor: pointer; padding: 0;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), inset 0 -1px 1px rgba(6, 16, 11, .35);
    transition: border-color .12s ease, box-shadow .12s ease, transform .12s ease;
  }
  .nt-check:hover { border-color: var(--nt-green); box-shadow: 0 0 9px rgba(0, 255, 136, .45); transform: scale(1.06); }
  .nt-check[aria-checked="true"] { background: linear-gradient(180deg, #4dffb0 0%, #00ff88 70%, #08a463 100%); border-color: #7dffc2; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 0 10px rgba(0, 255, 136, .6); }
  .nt-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .nt-text { font-size: 13px; color: var(--nt-ink); overflow-wrap: break-word; word-break: break-word; align-self: flex-start; max-width: 100%; }
  .nt-edit { background: rgba(0, 255, 136, .08); border: 1px solid var(--nt-green); border-radius: 6px; color: var(--nt-ink); font: inherit; font-size: 13px; padding: 2px 6px; outline: none; width: 100%; }
  .nt-stamp { font-size: 9.5px; letter-spacing: .06em; color: var(--nt-faint); font-variant-numeric: tabular-nums; }
  .nt-due {
    flex: none; min-width: 30px; padding: 1px 5px; font: inherit; font-size: 9px; font-weight: 700;
    letter-spacing: .04em; background: rgba(255, 255, 255, .04);
    border: 1px solid rgba(117, 117, 117, .4); border-radius: 6px; color: var(--nt-faint);
    cursor: pointer; white-space: nowrap;
  }
  .nt-due:hover { border-color: var(--nt-green); color: var(--nt-green); }
  .nt-due.none { opacity: .55; }
  .nt-due.over { border-color: rgba(255, 255, 0, .6); color: var(--nt-yellow); background: rgba(255, 255, 0, .08); text-shadow: 0 0 6px rgba(255, 255, 0, .5); }
  .nt-prio {
    flex: none; min-width: 26px; padding: 1px 5px; font: inherit; font-size: 9.5px; font-weight: 800;
    letter-spacing: .06em; background: rgba(255, 255, 255, .04);
    border: 1px solid rgba(117, 117, 117, .4); border-radius: 6px; color: var(--nt-faint); cursor: pointer;
  }
  .nt-prio[data-p="1"] { color: var(--nt-yellow); border-color: rgba(255, 255, 0, .55); text-shadow: 0 0 6px rgba(255, 255, 0, .45); }
  .nt-prio[data-p="2"] { color: var(--nt-green); border-color: rgba(0, 255, 136, .55); text-shadow: 0 0 6px rgba(0, 255, 136, .45); }
  .nt-prio[data-p="3"] { color: #9a9a9a; border-color: rgba(117, 117, 117, .7); }
  .nt-actions { flex: none; display: flex; gap: 2px; opacity: 0; transition: opacity .12s ease; }
  .nt-row:hover .nt-actions, .nt-row:focus-within .nt-actions { opacity: 1; }
  .nt-xpfloat {
    position: absolute; right: 6px; top: -2px; font-size: 12px; font-weight: 800;
    letter-spacing: .04em; color: var(--nt-yellow);
    text-shadow: 0 0 10px rgba(255, 255, 0, .7), 0 1px 0 rgba(6, 16, 11, .6);
    pointer-events: none; animation: nt-rise .85s ease-out forwards;
  }
  .nt-empty { display: flex; align-items: center; gap: 8px; padding: 20px 6px; justify-content: center; color: var(--nt-faint); font-size: 11.5px; letter-spacing: .04em; }
  .nt-foot { position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 9px 14px 12px; border-top: 1px solid rgba(117, 117, 117, .28); }
  .nt-progress { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .nt-progress-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(117, 117, 117, .25); box-shadow: inset 0 1px 2px rgba(6, 16, 11, .4); overflow: hidden; }
  .nt-progress-fill { height: 100%; border-radius: 3px; background: linear-gradient(180deg, #7dffc2, #00ff88); box-shadow: 0 0 9px rgba(0, 255, 136, .55), inset 0 1px 0 rgba(255, 255, 255, .5); transition: width .25s ease; }
  .nt-progress-num { font-size: 10.5px; color: var(--nt-dim); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  .nt-sound {
    width: 24px; height: 22px; display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, .04); border: 1px solid rgba(117, 117, 117, .35);
    border-radius: 6px; color: var(--nt-dim); font: inherit; font-size: 11px; cursor: pointer; padding: 0;
  }
  .nt-sound:hover { color: var(--nt-yellow); border-color: rgba(255, 255, 0, .5); }
  .nt-sound[aria-pressed="true"] { color: var(--nt-yellow); }
  .nt-sound[aria-pressed="false"] { color: var(--nt-faint); text-decoration: line-through; }
  .nt-purge {
    padding: 4px 10px; background: rgba(255, 255, 255, .04); border: 1px solid rgba(255, 255, 0, .55);
    border-radius: 7px; color: var(--nt-yellow); font: inherit; font-size: 10px; letter-spacing: .1em;
    cursor: pointer; white-space: nowrap; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .15);
  }
  .nt-purge:hover:not(:disabled) { background: rgba(255, 255, 0, .12); }
  .nt-purge:disabled { opacity: .35; cursor: not-allowed; }
  .nt-purge.armed { border-color: var(--nt-yellow); background: var(--nt-yellow); color: #08130d; font-weight: 800; animation: nt-blink .5s steps(2, start) infinite; }
  .nt-levelup {
    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); z-index: 9;
    display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 0;
    pointer-events: none;
    background: linear-gradient(90deg, transparent, rgba(0, 255, 136, .22), transparent);
    animation: nt-level 1.9s ease-out forwards;
  }
  .nt-levelup-k { font-size: 12px; font-weight: 800; letter-spacing: .3em; color: var(--nt-yellow); text-shadow: 0 0 12px rgba(255, 255, 0, .7); }
  .nt-levelup-lv { font-size: 26px; font-weight: 800; color: #fff; text-shadow: 0 0 18px rgba(0, 255, 136, .9), 0 0 4px rgba(255, 255, 255, .8); letter-spacing: .02em; }
  .nt-datarow { position: relative; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 0 14px 10px; margin-top: -2px; }
  .nt-data {
    appearance: none; display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px;
    border-radius: 7px; border: 1px solid rgba(117, 117, 117, .45); background: rgba(255, 255, 255, .03);
    color: var(--nt-dim); font: inherit; font-size: 10.5px; letter-spacing: .08em; cursor: pointer;
  }
  .nt-data:hover { border-color: rgba(0, 255, 136, .6); color: var(--nt-green); background: rgba(0, 255, 136, .06); }
  .nt-data.armed { border-color: var(--nt-yellow); background: var(--nt-yellow); color: #08130d; font-weight: 800; animation: nt-blink .5s steps(2, start) infinite; }
  .nt-data-k { font-size: 11.5px; font-weight: 800; line-height: 1; }
  .nt-notice { margin-left: auto; font-size: 10.5px; letter-spacing: .04em; color: var(--nt-green); white-space: nowrap; }
  .nt-notice.err { color: var(--nt-yellow); }
  .nt-root :focus-visible { outline: 1.5px solid var(--nt-green); outline-offset: 2px; }
  @keyframes nt-blink { 50% { opacity: 0 } }
  @keyframes nt-boot { from { opacity: 0; transform: translateY(-4px) } to { opacity: 1; transform: none } }
  @keyframes nt-glitchin { from { opacity: 0; transform: translateX(-6px) } to { opacity: 1; transform: none } }
  @keyframes nt-shake { 0%, 100% { transform: translateX(0) } 25% { transform: translateX(-3px) } 75% { transform: translateX(3px) } }
  @keyframes nt-pop { from { transform: scale(.92); opacity: .4 } to { transform: scale(1); opacity: 1 } }
  @keyframes nt-rise { 0% { opacity: 0; transform: translateY(4px) } 25% { opacity: 1 } 100% { opacity: 0; transform: translateY(-16px) } }
  @keyframes nt-alarm { 0%, 100% { box-shadow: 0 8px 20px var(--nt-shadow), 0 0 0 1px rgba(117, 117, 117, .35), 0 0 16px rgba(0, 255, 136, .2) } 50% { box-shadow: 0 8px 20px var(--nt-shadow), 0 0 0 1px rgba(117, 117, 117, .5), 0 0 32px rgba(0, 255, 136, .85) } }
  @keyframes nt-level { 0% { opacity: 0; transform: translateY(-50%) scale(.8) } 18% { opacity: 1; transform: translateY(-50%) scale(1.04) } 30% { transform: translateY(-50%) scale(1) } 80% { opacity: 1 } 100% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important } }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';

  var STORE_KEY = 'neon-tasks-standalone:v1';
  var MAX_TASKS = 500;
  var XP_BASE = [10, 15, 25, 40];
  var LEVEL_STEP = 120;
  var COMBO_WINDOW = 120000;
  var COMBO_STEP = 0.25;
  var COMBO_MAX = 2;

  function nowMs() { return Date.now(); }
  function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function clockText(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
  function newId() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
    return 't-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  }

  // ---------- persistence ----------
  function emptyState() {
    return { tasks: [], player: { xp: 0, level: 1, combo: 0, comboAt: 0, best: 0, totalDone: 0 }, ui: { expanded: false, pos: null, muted: false } };
  }
  function validTask(x) {
    return !!x && typeof x === 'object'
      && typeof x.id === 'string' && typeof x.text === 'string' && typeof x.done === 'boolean'
      && [0, 1, 2, 3].indexOf(x.priority) !== -1
      && typeof x.createdAt === 'number'
      && (x.completedAt === null || typeof x.completedAt === 'number')
      && (x.due === undefined || x.due === null || typeof x.due === 'number');
  }
  function sanitize(raw) {
    var s = emptyState();
    if (!raw || typeof raw !== 'object') return s;
    if (Array.isArray(raw.tasks)) {
      s.tasks = raw.tasks.filter(validTask).map(function (x) {
        return {
          id: x.id, text: x.text.slice(0, 400), done: x.done, priority: x.priority,
          createdAt: x.createdAt, completedAt: x.completedAt,
          due: typeof x.due === 'number' ? x.due : null,
          killed: !!x.killed
        };
      });
    }
    var p = raw.player || {};
    var num = function (v, d) { return typeof v === 'number' && isFinite(v) ? v : d; };
    s.player = {
      xp: Math.max(0, num(p.xp, 0)),
      level: Math.max(1, Math.floor(num(p.level, 1))),
      combo: Math.max(0, Math.floor(num(p.combo, 0))),
      comboAt: Math.max(0, num(p.comboAt, 0)),
      best: Math.max(0, Math.floor(num(p.best, 0))),
      totalDone: Math.max(0, Math.floor(num(p.totalDone, 0)))
    };
    var ui = raw.ui || {};
    s.ui = {
      expanded: !!ui.expanded,
      pos: (ui.pos && typeof ui.pos.x === 'number' && typeof ui.pos.y === 'number') ? ui.pos : null,
      muted: !!ui.muted
    };
    return s;
  }
  function loadState() {
    try { return sanitize(JSON.parse(localStorage.getItem(STORE_KEY))); } catch (e) { return emptyState(); }
  }
  var state = loadState();
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  // ---------- export / import ----------
  function flash(text, err) {
    view.notice = { text: text, err: !!err };
    clearTimeout(timers.notice);
    timers.notice = setTimeout(function () { view.notice = null; render(); }, 2800);
    render();
  }
  function exportJson() {
    var payload = {
      app: 'neon-tasks-standalone',
      version: 1,
      exportedAt: new Date().toISOString(),
      tasks: state.tasks,
      player: state.player,
      ui: state.ui,
    };
    var text = JSON.stringify(payload, null, 2);
    var d = new Date();
    var name = 'neon-tasks-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + '.json';
    var U = window.URL || window.webkitURL;
    if (!U || typeof Blob === 'undefined') { flash('当前环境不支持下载', true); return; }
    try {
      var blob = new Blob([text], { type: 'application/json' });
      var url = U.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { U.revokeObjectURL(url); }, 1500);
      flash('已导出 ' + state.tasks.length + ' 条任务');
    } catch (e) {
      flash('导出失败：' + (e && e.message ? e.message : '未知错误'), true);
    }
  }
  function importFlow() {
    if (!view.importArmed) {
      view.importArmed = true;
      clearTimeout(timers.importArm);
      timers.importArm = setTimeout(function () { view.importArmed = false; render(); }, 3200);
      render();
      return;
    }
    view.importArmed = false;
    render();
    filePicker.click();
  }
  function applyImport(text) {
    var raw = null;
    try { raw = JSON.parse(text); } catch (e) { flash('不是有效 JSON', true); return; }
    if (!raw || typeof raw !== 'object' || !Array.isArray(raw.tasks)) { flash('不是 Neon Tasks 备份文件', true); return; }
    if (raw.tasks.length > MAX_TASKS) { flash('任务数超过上限 ' + MAX_TASKS, true); return; }
    var next = sanitize(raw);
    var seen = {};
    next.tasks = next.tasks.filter(function (t) {
      if (seen[t.id]) return false;
      seen[t.id] = true;
      return true;
    });
    next.ui = state.ui; // 只覆盖任务与等级，不改变本机窗口位置/展开态
    state = next;
    view.editingId = null; view.editDraft = ''; view.inputValue = ''; view.purgeArmed = false; view.notice = null;
    save(); render();
    flash('已导入 ' + state.tasks.length + ' 条任务');
  }

  // ---------- xp ----------
  function levelThreshold(level) { return LEVEL_STEP * level; }
  function comboMultiplier(combo) { return Math.min(1 + COMBO_STEP * Math.max(0, combo - 1), COMBO_MAX); }
  function applyKill(priority, now) {
    var p = state.player;
    var combo = now - p.comboAt <= COMBO_WINDOW ? p.combo + 1 : 1;
    var gained = Math.round(XP_BASE[priority] * comboMultiplier(combo));
    var xp = p.xp + gained;
    var level = p.level;
    var leveled = false;
    while (xp >= levelThreshold(level)) { xp -= levelThreshold(level); level++; leveled = true; }
    state.player = { xp: xp, level: level, combo: combo, comboAt: now, best: Math.max(p.best, combo), totalDone: p.totalDone + 1 };
    return { gained: gained, leveled: leveled };
  }

  // ---------- deadlines ----------
  function tonight() {
    var d = new Date(nowMs()); d.setHours(21, 0, 0, 0);
    if (d.getTime() <= nowMs()) d.setDate(d.getDate() + 1);
    return d.getTime();
  }
  function tomorrow() { var d = new Date(tonight()); d.setDate(d.getDate() + 1); return d.getTime(); }
  function nextDue(current) {
    var now = nowMs(), night = tonight(), tom = tomorrow();
    if (current === null) return now + 2 * 3600000;
    if (Math.abs(current - night) < 60000) return tom;
    if (current > now && current <= now + 2 * 3600000 + 60000) return night;
    return null;
  }
  function dueText(due) {
    if (due === null) return '无截止';
    var diff = due - nowMs();
    if (diff < 0) {
      var late = -diff, h = Math.floor(late / 3600000);
      if (h >= 24) return '逾期 ' + Math.floor(h / 24) + 'd';
      if (h >= 1) return '逾期 ' + h + 'h';
      return '逾期 ' + Math.max(1, Math.floor(late / 60000)) + 'm';
    }
    var r = Math.floor(diff / 3600000);
    if (r >= 24) return Math.floor(r / 24) + 'd';
    if (r >= 1) return r + 'h';
    return Math.max(1, Math.floor(diff / 60000)) + 'm';
  }

  // ---------- sound ----------
  var audioCtx = null;
  function audio() {
    if (audioCtx === null) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, at, dur, type, peak) {
    var ac = audio();
    if (!ac) return;
    var t0 = ac.currentTime + at;
    var osc = ac.createOscillator(), gain = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peak, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function playKill(combo) {
    var pitch = Math.min(1 + 0.12 * Math.max(0, combo - 1), 1.7);
    tone(760 * pitch, 0, 0.09, 'triangle', 0.10);
    tone(1140 * pitch, 0.055, 0.14, 'sine', 0.08);
  }
  function playLevelUp() {
    [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone(f, i * 0.085, 0.2, 'triangle', 0.09); tone(f * 2, i * 0.085, 0.12, 'sine', 0.04); });
  }
  function playUnmute() { tone(880, 0, 0.08, 'sine', 0.07); tone(1320, 0.07, 0.1, 'sine', 0.06); }

  // ---------- dom helpers ----------
  function h(tag, props, kids) {
    var el = document.createElement(tag);
    if (props) {
      for (var k in props) {
        if (!props.hasOwnProperty(k)) continue;
        var v = props[k];
        if (v === null || v === undefined) continue;
        if (k === 'text') el.textContent = v;
        else if (k === 'cls') el.className = v;
        else if (k === 'style') el.setAttribute('style', v);
        else if (k.indexOf('on') === 0 && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
        else if (k === 'aria') { for (var a in v) el.setAttribute('aria-' + a, v[a]); }
        else el.setAttribute(k, v);
      }
    }
    (kids || []).forEach(function (c) { if (c) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }

  var app = document.getElementById('app');
  var view = { filter: 'all', inputValue: '', ddlPick: 0, editingId: null, editDraft: '', justDone: null, justGained: 0, levelToast: null, purgeArmed: false, importArmed: false, notice: null, err: false };
  var timers = { justDone: null, toast: null, purge: null, importArm: null, notice: null };
  var drag = null;
  var dragMoved = false;

  // ---------- render ----------
  function render() {
    var focusedId = document.activeElement && document.activeElement.id;
    app.innerHTML = '';
    app.appendChild(state.ui.expanded ? panel() : ball());
    if (focusedId === 'nt-input') { var i = document.getElementById('nt-input'); if (i) i.focus(); }
    if (view.editingId) { var e = document.querySelector('.nt-edit'); if (e) { e.focus(); e.select(); } }
    positionNode();
    updateLive();
  }

  function updateLive() {
    var c = document.getElementById('nt-clock');
    if (c) c.textContent = clockText(new Date());
    document.querySelectorAll('.nt-due').forEach(function (chip) {
      var raw = chip.getAttribute('data-due');
      var v = (raw === null || raw === '') ? null : Number(raw);
      if (v !== null && !isFinite(v)) v = null;
      var task = state.tasks.find(function (t) { return t.id === chip.getAttribute('data-id'); });
      chip.textContent = dueText(v);
      var over = !!(task && !task.done && v !== null && v < nowMs());
      chip.classList.toggle('over', over);
      chip.classList.toggle('none', v === null);
    });
  }

  function activeTasks() {
    var now = nowMs();
    return state.tasks.filter(function (x) { return !x.done; }).sort(function (a, b) {
      var ao = (a.due !== null && a.due < now) ? 0 : 1;
      var bo = (b.due !== null && b.due < now) ? 0 : 1;
      return (ao - bo) || (b.priority - a.priority) || (a.createdAt - b.createdAt);
    });
  }
  function doneTasks() {
    return state.tasks.filter(function (x) { return x.done; }).sort(function (a, b) {
      return ((b.completedAt || 0) - (a.completedAt || 0)) || (a.createdAt - b.createdAt);
    });
  }

  function ball() {
    var active = activeTasks();
    var overdue = active.filter(function (x) { return x.due !== null && x.due < nowMs(); }).length;
    var xpPct = Math.min(100, Math.round(state.player.xp / levelThreshold(state.player.level) * 100));
    var ring = 'conic-gradient(from -90deg, #00ff88 0% ' + Math.max(2, xpPct) + '%, rgba(117,117,117,.3) ' + Math.max(2, xpPct) + '% 100%)';
    var node = h('div', {
      cls: 'nt-root nt-node' + (overdue > 0 ? ' alarm' : ''),
      role: 'button', tabindex: '0',
      style: 'background:' + ring,
      aria: { label: '赛博朋克 · ' + active.length + ' 待办' + (overdue > 0 ? ' · ' + overdue + ' 逾期' : ''), expanded: String(state.ui.expanded) },
      onpointerdown: function (e) { startDrag(e); },
      onpointermove: function (e) { moveDrag(e); },
      onpointerup: function () { endDrag(); },
      onpointercancel: function () { endDrag(); },
      onclick: function () { if (!dragMoved) toggleExpanded(true); },
      onkeydown: function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleExpanded(true); } },
    }, [
      h('div', { cls: 'nt-node-core' }, [
        h('span', { cls: 'nt-node-count' + (overdue > 0 ? ' overdue' : ''), text: String(active.length) }),
        overdue > 0 ? h('span', { cls: 'nt-node-bang', text: '!' }) : null,
      ]),
    ]);
    return node;
  }

  function toggleExpanded(open) {
    state.ui.expanded = open;
    save();
    render();
  }

  function panel() {
    var now = nowMs();
    var active = activeTasks();
    var done = doneTasks();
    var overdue = active.filter(function (x) { return x.due !== null && x.due < now; }).length;
    var xpNeed = levelThreshold(state.player.level);
    var xpPct = Math.min(100, Math.round(state.player.xp / xpNeed * 100));
    var comboLive = state.player.combo > 1 && now - state.player.comboAt <= COMBO_WINDOW;
    var mult = comboLive ? comboMultiplier(state.player.combo) : 1;
    var visible = view.filter === 'all' ? active.concat(done) : (view.filter === 'active' ? active : done);

    var head = h('div', {
      cls: 'nt-head', onpointerdown: function (e) { startDrag(e); }, onpointermove: function (e) { moveDrag(e); }, onpointerup: function () { endDrag(); }, onpointercancel: function () { endDrag(); },
      onclick: function () { if (!dragMoved) toggleExpanded(false); },
    }, [
      h('div', { cls: 'nt-headtext' }, [
        h('span', { cls: 'nt-title', text: '赛博朋克' }),
        h('span', { cls: 'nt-sub' }, [
          h('span', { cls: 'nt-sub-en', text: 'Todo list' }),
          h('span', { cls: 'nt-sub-sep', text: '·' }),
          h('span', { cls: 'nt-sub-track', text: 'COLOR SCHEME SHARING' }),
        ]),
      ]),
      comboLive ? h('span', { cls: 'nt-combo', text: '×' + mult.toFixed(2) }) : null,
      h('span', { cls: 'nt-cursor' }),
      h('span', { cls: 'nt-spacer' }),
      h('button', { cls: 'nt-iconbtn nt-headbtn', type: 'button', aria: { label: '收起' }, onclick: function (e) { e.stopPropagation(); toggleExpanded(false); }, text: '−' }),
    ]);

    var xpline = h('div', { cls: 'nt-xpline' }, [
      h('div', { cls: 'nt-xpbar' }, [h('div', { cls: 'nt-xpfill', style: 'width:' + xpPct + '%' })]),
      h('span', { cls: 'nt-xpnum', text: state.player.xp + '/' + xpNeed }),
    ]);

    var status = h('div', { cls: 'nt-statusline' }, [
      h('span', { text: '待办 ' + active.length + ' · 完成 ' + done.length + (state.player.best > 1 ? ' · BEST ×' + state.player.best : '') }),
      h('span', { cls: 'nt-spacer' }),
      h('span', { cls: 'nt-sync-ok', text: '本地存储' }),
      h('span', { cls: 'nt-clock', id: 'nt-clock', text: clockText(new Date()) }),
    ]);

    var input = h('input', {
      cls: 'nt-input', id: 'nt-input', maxlength: '400', placeholder: '添加任务…',
      aria: { label: '添加任务' },
      value: view.inputValue,
      oninput: function (e) { view.inputValue = e.target.value; },
      onkeydown: function (e) { if (e.key === 'Enter') { e.preventDefault(); addTask(); } },
    });
    var entry = h('div', { cls: 'nt-entry' + (view.err ? ' err' : '') }, [h('span', { cls: 'nt-prompt', text: '+' }), input]);

    var ddl = h('div', { cls: 'nt-ddlpick' }, ['无截止', '2小时', '今晚', '明天'].map(function (label, i) {
      return h('button', {
        cls: 'nt-ddlchip', type: 'button', aria: { pressed: String(view.ddlPick === i) },
        onclick: function () { view.ddlPick = i; render(); }, text: label,
      });
    }));

    var filters = h('div', { cls: 'nt-filters' }, [['all', '全部'], ['active', '待办'], ['done', '完成']].map(function (pair) {
      return h('button', {
        cls: 'nt-filter', type: 'button', aria: { pressed: String(view.filter === pair[0]) },
        onclick: function () { view.filter = pair[0]; render(); }, text: pair[1],
      });
    }));

    var emptyText = view.filter === 'all' ? '还没有任务，添加第一条吧' : view.filter === 'active' ? '暂无待办任务' : '还没有已完成的任务';
    var list = h('ul', { cls: 'nt-list' }, visible.length === 0
      ? [h('li', { cls: 'nt-empty' }, [h('span', { cls: 'nt-empty-txt', text: emptyText })])]
      : visible.map(row));

    var foot = h('div', { cls: 'nt-foot' }, [
      h('div', { cls: 'nt-progress' }, [
        h('div', { cls: 'nt-progress-track' }, [h('div', { cls: 'nt-progress-fill', style: 'width:' + (state.tasks.length ? Math.round(done.length / state.tasks.length * 100) : 0) + '%' })]),
        h('span', { cls: 'nt-progress-num', text: (state.tasks.length ? Math.round(done.length / state.tasks.length * 100) : 0) + '%' }),
      ]),
      h('button', {
        cls: 'nt-sound', type: 'button', aria: { pressed: String(!state.ui.muted), label: state.ui.muted ? '音效关' : '音效开' },
        onclick: function () { state.ui.muted = !state.ui.muted; if (!state.ui.muted) playUnmute(); save(); render(); }, text: '♪',
      }),
      h('button', {
        cls: 'nt-purge' + (view.purgeArmed ? ' armed' : ''), type: 'button', disabled: done.length === 0 && !view.purgeArmed ? 'true' : null,
        onclick: purgeDone, text: view.purgeArmed ? '确认清除？' : '清空已完成',
      }),
    ]);

    var dataRow = h('div', { cls: 'nt-datarow' }, [
      h('button', { cls: 'nt-data', type: 'button', aria: { label: '导出 JSON 备份' }, onclick: exportJson }, [
        h('span', { cls: 'nt-data-k', text: '↓' }),
        h('span', { text: '导出' }),
      ]),
      h('button', {
        cls: 'nt-data' + (view.importArmed ? ' armed' : ''), type: 'button',
        aria: { label: view.importArmed ? '再点一次选择文件并覆盖当前数据' : '导入 JSON 备份' },
        onclick: importFlow,
      }, [
        h('span', { cls: 'nt-data-k', text: '↑' }),
        h('span', { text: view.importArmed ? '确认覆盖？' : '导入' }),
      ]),
      view.notice ? h('span', { cls: 'nt-notice' + (view.notice.err ? ' err' : ''), role: 'status', text: view.notice.text }) : null,
    ]);

    var tab = h('div', { cls: 'nt-tab' }, [
      h('span', { cls: 'nt-tab-lv', text: 'LV ' + state.player.level }),
      h('span', { cls: 'nt-tab-dot nt-tab-dot-y' }),
      h('span', { cls: 'nt-tab-dot nt-tab-dot-r' }),
    ]);

    var metal = h('div', { cls: 'nt-metal' }, [
      h('div', { cls: 'nt-glass' }, [head, xpline, status, entry, ddl, filters, list, foot, dataRow]),
    ]);

    var wrap = h('div', { cls: 'nt-root nt-panel' }, [
      h('div', { cls: 'nt-back nt-back-1' }),
      h('div', { cls: 'nt-back nt-back-2' }),
      tab, metal,
      view.levelToast !== null ? h('div', { cls: 'nt-levelup', role: 'status' }, [
        h('span', { cls: 'nt-levelup-k', text: '升级' }),
        h('span', { cls: 'nt-levelup-lv', text: 'LV ' + view.levelToast }),
      ]) : null,
    ]);
    return wrap;
  }

  function row(task) {
    var editing = view.editingId === task.id;
    var overdue = !task.done && task.due !== null && task.due < nowMs();
    var created = new Date(task.createdAt);
    var stamp = task.done && task.completedAt ? '完成 ' + clockText(new Date(task.completedAt)) : '+' + clockText(created);

    var textEl = editing
      ? h('input', {
        cls: 'nt-edit', value: view.editDraft,
        oninput: function (e) { view.editDraft = e.target.value; },
        onkeydown: function (e) {
          if (e.key === 'Enter') { e.preventDefault(); commitEdit(task.id); }
          else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); view.editingId = null; render(); }
        },
        onblur: function () { commitEdit(task.id); },
      })
      : h('span', { cls: 'nt-text', text: task.text });

    return h('li', { cls: 'nt-row' + (task.done ? ' done' : '') + (view.justDone === task.id ? ' pop' : '') }, [
      h('button', {
        cls: 'nt-check', type: 'button', role: 'checkbox', aria: { checked: String(task.done), label: task.done ? '标记为待办' : '标记完成' },
        onclick: function () { kill(task.id); },
      }, task.done ? [h('svg', { width: '12', height: '12', viewBox: '0 0 12 12' }, [h('path', { d: 'M2.2 6.4 L4.9 9.1 L9.8 2.9', stroke: '#ffff00', 'stroke-width': '2', fill: 'none', 'stroke-linecap': 'square' })])] : []),
      h('div', { cls: 'nt-main' }, [
        textEl,
        h('span', { cls: 'nt-stamp', title: '创建 +' + clockText(created), text: stamp }),
      ]),
      h('button', {
        cls: 'nt-due' + (task.due === null ? ' none' : '') + (overdue ? ' over' : ''),
        type: 'button', 'data-id': task.id, 'data-due': task.due === null ? '' : String(task.due),
        title: '循环切换截止时间', text: dueText(task.due),
        onclick: function () { cycleDue(task.id); },
      }),
      h('button', {
        cls: 'nt-prio', type: 'button', 'data-p': String(task.priority),
        title: ['无优先级', '优先级 1', '优先级 2', '优先级 3'][task.priority],
        text: task.priority === 0 ? '--' : 'P' + task.priority,
        onclick: function () { cyclePriority(task.id); },
      }),
      h('div', { cls: 'nt-actions' }, [
        h('button', { cls: 'nt-iconbtn', type: 'button', aria: { label: '编辑任务' }, text: '✎', onclick: function () { startEdit(task.id); } }),
        h('button', { cls: 'nt-iconbtn nt-iconbtn-del', type: 'button', aria: { label: '删除任务' }, text: '×', onclick: function () { removeTask(task.id); } }),
      ]),
      view.justDone === task.id && view.justGained > 0 ? h('span', { cls: 'nt-xpfloat', text: '+' + view.justGained + ' XP' }) : null,
    ]);
  }

  // ---------- actions ----------
  function addTask() {
    var text = view.inputValue.trim();
    if (text === '') {
      view.err = true; render();
      setTimeout(function () { view.err = false; render(); }, 320);
      return;
    }
    if (state.tasks.length >= MAX_TASKS) return;
    var due = view.ddlPick === 1 ? nowMs() + 2 * 3600000 : view.ddlPick === 2 ? tonight() : view.ddlPick === 3 ? tomorrow() : null;
    state.tasks.push({ id: newId(), text: text, done: false, priority: 0, createdAt: nowMs(), completedAt: null, due: due, killed: false });
    view.inputValue = '';
    view.ddlPick = 0;
    if (view.filter === 'done') view.filter = 'all';
    save(); render();
    var i = document.getElementById('nt-input'); if (i) i.focus();
  }

  function kill(id) {
    var task = state.tasks.find(function (x) { return x.id === id; });
    if (!task) return;
    if (task.done) {
      task.done = false; task.completedAt = null;
      save(); render(); return;
    }
    var firstKill = !task.killed;
    task.done = true; task.completedAt = nowMs(); task.killed = true;
    var gain = 0;
    if (firstKill) {
      var r = applyKill(task.priority, nowMs());
      gain = r.gained;
      if (r.leveled) {
        view.levelToast = state.player.level;
        if (!state.ui.muted) playLevelUp();
        clearTimeout(timers.toast);
        timers.toast = setTimeout(function () { view.levelToast = null; render(); }, 1900);
      }
    }
    if (!state.ui.muted) playKill(state.player.combo);
    view.justDone = id; view.justGained = gain;
    clearTimeout(timers.justDone);
    timers.justDone = setTimeout(function () { view.justDone = null; render(); }, 900);
    save(); render();
  }

  function cyclePriority(id) {
    var t = state.tasks.find(function (x) { return x.id === id; });
    if (!t) return;
    t.priority = (t.priority + 1) % 4;
    save(); render();
  }
  function cycleDue(id) {
    var t = state.tasks.find(function (x) { return x.id === id; });
    if (!t) return;
    t.due = nextDue(t.due);
    save(); render();
  }
  function startEdit(id) {
    var t = state.tasks.find(function (x) { return x.id === id; });
    if (!t) return;
    view.editingId = id; view.editDraft = t.text; render();
  }
  function commitEdit(id) {
    var value = view.editDraft.trim();
    var t = state.tasks.find(function (x) { return x.id === id; });
    if (!t) { view.editingId = null; render(); return; }
    if (value !== '') t.text = value;
    view.editingId = null;
    save(); render();
  }
  function removeTask(id) {
    state.tasks = state.tasks.filter(function (x) { return x.id !== id; });
    if (view.editingId === id) view.editingId = null;
    save(); render();
  }
  function purgeDone() {
    if (!view.purgeArmed) {
      view.purgeArmed = true; render();
      clearTimeout(timers.purge);
      timers.purge = setTimeout(function () { view.purgeArmed = false; render(); }, 3200);
      return;
    }
    clearTimeout(timers.purge);
    view.purgeArmed = false;
    state.tasks = state.tasks.filter(function (x) { return !x.done; });
    save(); render();
  }

  // ---------- drag ----------
  function startDrag(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    dragMoved = false;
    var rect = e.currentTarget.getBoundingClientRect();
    drag = { sx: e.clientX, sy: e.clientY, bx: rect.left, by: rect.top };
    if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
  }
  function moveDrag(e) {
    if (!drag) return;
    var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (Math.abs(dx) + Math.abs(dy) > 4) dragMoved = true;
    var node = app.firstElementChild;
    if (!node) return;
    var w = node.offsetWidth || 0, hh = node.offsetHeight || 0;
    var minY = state.ui.expanded ? 19 : 8;
    var x = clamp(drag.bx + dx, 8, Math.max(8, window.innerWidth - w - 8));
    var y = clamp(drag.by + dy, minY, Math.max(minY, window.innerHeight - hh - 8));
    state.ui.pos = { x: x, y: y };
    positionNode();
  }
  function endDrag() { if (drag) { save(); drag = null; } }

  function positionNode() {
    var node = app.firstElementChild;
    if (!node) return;
    node.style.position = 'fixed';
    node.style.zIndex = '10';
    if (state.ui.pos) {
      node.style.left = state.ui.pos.x + 'px';
      node.style.top = state.ui.pos.y + 'px';
      node.style.right = 'auto';
      node.style.bottom = 'auto';
    } else {
      node.style.right = '24px';
      node.style.bottom = '84px';
      node.style.left = 'auto';
      node.style.top = 'auto';
    }
  }

  // ---------- boot ----------
  var liveInterval = setInterval(updateLive, 1000);
  var filePicker = document.createElement('input');
  filePicker.type = 'file';
  filePicker.accept = 'application/json,.json';
  filePicker.style.display = 'none';
  filePicker.addEventListener('change', function () {
    var f = filePicker.files && filePicker.files[0];
    filePicker.value = '';
    if (!f) return;
    if (typeof f.text === 'function') {
      f.text().then(applyImport, function () { flash('读取文件失败', true); });
    } else {
      var r = new FileReader();
      r.onload = function () { applyImport(String(r.result || '')); };
      r.onerror = function () { flash('读取文件失败', true); };
      r.readAsText(f);
    }
  });
  document.body.appendChild(filePicker);
  window.addEventListener('resize', function () {
    if (state.ui.pos) {
      var node = app.firstElementChild;
      if (!node) return;
      var w = node.offsetWidth || 0, hh = node.offsetHeight || 0;
      var minY = state.ui.expanded ? 19 : 8;
      state.ui.pos.x = clamp(state.ui.pos.x, 8, Math.max(8, window.innerWidth - w - 8));
      state.ui.pos.y = clamp(state.ui.pos.y, minY, Math.max(minY, window.innerHeight - hh - 8));
      positionNode();
    }
  });

  render();
})();
</script>
</body>
</html>
